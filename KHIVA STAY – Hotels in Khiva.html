async function book(id){const h=hotels().find(x=>x.id===id),Q=S.Q,n=nights(Q.in,Q.out),R=h.rooms;readQ("bi","bo","bg");const name=$("gn").value.trim(),phone=$("gp").value.trim(),email=$("ge").value.trim();
 if(n<1||!name||phone.length<6||!/^\S+@\S+\.\S+$/.test(email)){$("be").textContent=t("bd");return}
 const room=R.find(r=>r.id===S.rid)||R[0],qty=S.qty||1;if(room){const a=avail(h,room);if(a===0||(a!=null&&qty>a)){$("be").textContent=t("full");return}}
 const bid="b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ref="KS-"+bid.slice(-6).toUpperCase();
 const b={ref,hid:h.id,hname:h.name,room:room?room.name:"",rid:room?room.id:"",qty:room?qty:0,in:Q.in,out:Q.out,n,g:Q.g,name,phone,email,total:room?room.price*n*qty:0,status:"pending",created:Date.now()};
 if(!S.db){$("be").textContent=t("nodb")+(h.phone?" "+h.phone:"");return}
 try{if(!S.uid)throw 0;const ref=S.db.doc("bookings/"+S.uid),fld={};fld["b_"+bid]=b;try{await ref.update(fld)}catch(e){await ref.set(fld)}await S.db.doc("holds/"+bid).set({hid:h.id,rid:b.rid,qty:b.qty||1,in:b.in,out:b.out,status:"pending"});S.last=b;location.hash="done-"+ref}catch(e){$("be").textContent=t("nodb")+(h.phone?" "+h.phone:"")}}
